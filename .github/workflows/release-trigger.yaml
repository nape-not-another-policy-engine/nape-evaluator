name: NAPE Evaluator - Release Workflow

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  validate:
    name: Release Gate Validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install evaluator package and runtime dependencies
        run: python -m pip install .

      - name: Run release gate
        run: make release-validate

  release:
    needs: validate
    uses: nape-not-another-policy-engine/nape-build-deploy-release/.github/workflows/pypi-standard-release-workflow.yaml@main
    secrets: inherit
    with:
      publish_target: "prod"
